name: Simple Diagnostic

on:
  push:
    branches: [claude/fix-r-dependencies-setup-011CUqetA6Zfj2wcLoh7Ab8U]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Check DESCRIPTION file
        run: |
          echo "=== DESCRIPTION file contents ==="
          cat DESCRIPTION
          echo ""
          echo "=== Checking DESCRIPTION syntax ==="
          Rscript -e "desc <- read.dcf('DESCRIPTION'); print(desc)"

      - name: Check package structure
        run: |
          echo "=== Package structure ==="
          ls -la
          echo ""
          echo "=== R directory ==="
          ls -la R/ | head -20
          echo ""
          echo "=== NAMESPACE file ==="
          cat NAMESPACE

      - name: Try installing base dependencies only
        run: |
          echo "=== Installing digest package ==="
          Rscript -e "install.packages('digest', repos='https://cloud.r-project.org')"
          echo ""
          echo "=== Installing rcmdcheck ==="
          Rscript -e "install.packages('rcmdcheck', repos='https://cloud.r-project.org')"

      - name: Try setup-r-dependencies with verbose output
        run: |
          echo "=== About to run setup-r-dependencies ==="
          echo "This will show us exactly where it fails"

      - uses: r-lib/actions/setup-r-dependencies@v2
        continue-on-error: true
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check what got installed
        if: always()
        run: |
          echo "=== Installed packages ==="
          Rscript -e "print(installed.packages()[,c('Package','Version')])"
