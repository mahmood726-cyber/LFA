name: R Check - Minimal

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_CRAN_INCOMING_REMOTE_: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install ONLY required packages
        run: |
          # Install base checking tools
          install.packages("rcmdcheck", repos = "https://cloud.r-project.org", type = "binary")

          # Install ONLY Imports (the packages in the DESCRIPTION Imports field)
          # These are already installed as base R packages: stats, graphics, utils, methods, parallel
          # Only need to install: digest
          install.packages("digest", repos = "https://cloud.r-project.org", type = "binary")
        shell: Rscript {0}

      - name: Check package
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")
        shell: Rscript {0}
